- id: M2-C25
  statement: 'The fixture is bias-observable with NO bias prior: with per-keyframe bias (state dim 3 x
    (6 pose + 3 vel + 6 bias) = 45), two GalileanCombinedImuFactor edges, a pose and a velocity prior
    on KF0 and GNSS position factors on KF1 and KF2, the linearized Jacobian at ground truth has rank
    45/45 (nullity 0). The IMU edges alone give rank 30/45 and the KF0 pose+velocity priors take that
    to 39/45 -- but both of those are FULL ROW RANK on a 30x45 and a 39x45 matrix, the maximum possible,
    so they are structural non-degeneracy checks and say nothing about observability; only rank 45 on
    the square 45x45 system is an observability statement. The 6 directions remaining at rank 39 are
    NOT the bias block: 42% of the nullspace energy (2.537 of 6) lies in pose/velocity coordinates and
    the principal cosines between the nullspace and the bias-coordinate subspace are [0.978, 0.978, 0.839,
    0.816, 0.300, 0.299] -- two of them at arccos(0.30) ~ 72.5 degrees. They are mixed bias/pose/velocity
    gauge directions. A 6-dim bias prior on one keyframe closes the gap because no null direction can
    be orthogonal to the bias block: the bias random-walk factors force every null vector into the form
    (M delta; delta, delta, delta) with delta != 0. That is a structural fact, and a strictly weaker statement
    than observability without a prior. The principal cosines are in GTSAM''s tangent coordinates and change
    if the bias coordinates are rescaled.'
  source: DERIVED (re-measured on this fixture; reproduces the pre-flight F9 pattern on new data)
  kind: DERIVED
  test_hint: 'Build the graph in GTSAM, linearize at ground truth, take jacobian() and matrix_rank with
    tol = max(shape)*eps*s[0]. Assert the three ranks 30, 39, 45, and assert explicitly that 30 and 39
    are the row counts so nobody mistakes them for observability results. Then take the rank-39 Jacobian''s
    right nullspace (45x6) and assert the principal cosines against the 18 bias columns are [0.978227,
    0.978041, 0.839290, 0.815739, 0.299838, 0.299389] to 1e-3 -- these are basis-independent, unlike
    the per-direction energy split -- and that the pose/velocity energy 6 - sum(cos^2) is 2.537. Also
    assert total graph error at ground truth <= 1e-18 (measured 7.5e-23) and each IMU factor''s unwhitened
    residual <= 1e-12 (measured 2.2e-14). Read the cosines as facts about GTSAM''s TANGENT COORDINATES:
    a change of bias units moves them (verification pass 2, F04); the coordinate-free content is that every null vector has a nonzero pose/velocity part. That a B0 prior
    closes the gap is STRUCTURAL, not luck: the random-walk factors force every null vector into the form
    (M delta; delta, delta, delta) with delta != 0, so none can be orthogonal to the bias block, exactly
    as the statement says; see the test comment.'
  domain: 'Rank is invariant to positive reweighting, so this does not depend on the noise model. The
    CONDITION number does and is NOT claimed: measured 7.5e7 with tight covariances and 7.6e6 with realistic
    MEMS densities.'
  verdict: CONFIRMED
  attack: see docs/verification/stage-b_m2-baselines_pass2.md
