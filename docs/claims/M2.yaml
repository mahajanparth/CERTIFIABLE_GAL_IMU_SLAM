  attack: see docs/verification/stage-b_m2-baselines_pass2.md
- id: M2-C21
  statement: The Gal(3) bias Jacobian recursion is J_{k+1} = Ad_{V_k^-1} J_k + C_k with J_i = 0, where
    V_k is the single-step Gal(3) increment and C_k = d/d(db) Log(Vhat_k^-1 V_k(db)) is that step's own
    right-chart bias Jacobian; running this recursion reproduces the finite-difference Jacobian of re-integration
    to within 1e-6 relative after 40 steps.
  source: DERIVED from U_{k+1}=U_k V_k (M2-C19); cross-checked against GTSAM 4.3.0
  kind: DERIVED
  test_hint: On the time-varying stream of M2-C19, accumulate J via Gal3.AdjointMap() on V_k.inverse()
    plus per-step C_k (FD at eps=1e-6); compare against the FD Jacobian of full re-integration at each
    of 40 steps. Measured 6.9e-9 absolute against |J| ~ 0.21, i.e. ~3e-8 relative.
  domain: 'Sign convention: C_k is the derivative w.r.t. the BIAS. The -C_k form in the literature uses
    the derivative w.r.t. the MEASUREMENT, which differs by the sign in (a_k - b_a). Fix the convention
    before comparing signs.'
  verdict: CONFIRMED
  attack: see docs/verification/stage-b_m2-baselines_pass2.md
- id: M2-C22
  statement: 'TIER 1 -- same discretization. Baselines 1 and 2 share Rai Eq. (9) and differ only in the
    rotation retraction, so at KF2 on the fixture they agree to 1e-6 in v, p AND R under the raw reading
    phi_k = (omega_k - bbar_g) dt that Rai Sec. IV-A fixes. The 3.0e-8 rotation gap at KF2 (elementwise max-abs of the rotation-matrix difference) is a PROPERTY of the
    Cayley retraction, not an error: Cay(theta a) rotates by 2 arctan(theta/2), losing theta^3/12 per
    step, so the gap is exactly ||omega||^3 T dt^2 / 12 per edge (2.3257e-8 and 5.5175e-8 rad, as rotation angles ||Log||_2) and is
    O(dt^2) -- the ratio is 0.25 per halving of dt over n = 100..1600. Substituting Exp for Cay must
    therefore make this claim FAIL, not pass.'
  source: DERIVED
  kind: DERIVED
  test_hint: 'Propagate B1 and B2-raw over the fixture; compare at KF2. Measured raw variant 6.2e-8 (v)
    / 4.4e-8 (p) / 3.0e-8 (R) -- 1e-6 gives ~16x margin on the worst of the three. Then the POSITIVE
    half, which is the half with teeth: assert the per-edge gap ||Log(dR_B1^T dR_B2)|| equals ||omega||^3
    T dt^2 / 12 to 1e-3 relative, that the KF2 gap is 3.0e-8 within +-10%, and that it scales as dt^2.
    METRIC: every KF2 rotation gap here (the Tier-1 3.0e-8 (R) and the +-10% band) is the elementwise
    matrix max-abs max|R_B2 - R_B1| (_max_abs in the tests), measured 2.996e-8. The same gap is 2.81e-8 in
    ||Log(R_B1^T R_B2)||_inf and 3.51e-8 in ||Log(R_B1^T R_B2)||_2, so the +-10% band holds only in the
    max-abs metric; the per-edge values are ||Log||_2.
    The reparameterized variant measures 1.5e-13 / 5.8e-14 / 2.3e-14 because it IS Exp; that is exhibited
    as a contrast, never asserted as agreement.'
  domain: 'The paper DOES state which reading is intended -- Sec. IV-A instructs a literal substitution
    of Cay and its Eq. (4) right Jacobian into Eq. (9a), Sec. II-A''s "Cay = Exp + O(||phi||^3)" is vacuous
