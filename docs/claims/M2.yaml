- id: M2-C20
  statement: 'The GalileanPreintegration bias correction uses a frozen first-order Jacobian composed EXACTLY
    on the right in Gal(3): with J in R^{10x6} fixed at bbar, U(db) = Uhat . Expmap_Gal3(J db) holds with
    residual <= 1e-8 for ||db|| up to 5e-2, whereas the component-wise first-order form (dR Exp(J_R db),
    dv + J_v db, dp + J_p db) using the SAME J is wrong by at least 1e-2 at ||db|| = 5e-2. Structurally
    J[0:3,0:3]=0 and J[9,:]=0 to 1e-10.'
  source: GTSAM 4.3.0 GalileanPreintegration -- measured
  kind: VERIFIED-PUBLISHED
  test_hint: 'Zero gravity and identity NavState make predict() return the corrected increment directly.
    Estimate J by finite differences at eps=1e-7 on Logmap(Uhat^-1 U(db)); then test both models over
    30 random directions at ||db|| in {1e-4,1e-3,1e-2,5e-2}. Measured (re-measured in the M2-F10 remediation,
    seed 20250218, eps=1e-7; the previously recorded 2.2e-12..1.2e-9 / 2.8e-4..1.3e-1 were not reproducible):
    right-composition 8.8e-13..4.4e-10 (edge 0) and 6.3e-13..3.2e-10 (edge 1), scaling LINEARLY with ||db||,
    i.e. FD noise in J, not model error; component-wise 1.96e-5..9.40e-3 (edge 0) and 2.05e-5..1.02e-2 (edge
    1) over the 30 random directions, and 2.67e-5..1.40e-2 / 3.12e-5..1.62e-2 once the leading model difference''s
    top singular direction is added -- the >= 1e-2 bound is a statement about the sup, which the 30 random
    directions undersample. The contrast''s error is also pinned to first order: its Gal(3) log against U(db)
    is (0, (R^T - I) xi_nu, (R^T - I) xi_rho, 0) with xi = J db, to 5.8e-4 / 2.4e-4 relative at ||db||=1e-4.'
  domain: The JACOBIAN is first order; the RETRACTION is exact. TangentPreintegration is ALSO exactly
    affine but in its own chart zeta=(Log dR, dp, dv) -- the difference is which chart the frozen Jacobian
    is exact in. Against re-integration both are O(||db||^2); Galilean coefficient ~0.67, about 2.8x smaller
    than Tangent's.
