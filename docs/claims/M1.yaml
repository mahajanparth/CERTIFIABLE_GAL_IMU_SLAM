milestone: M1
title: Gal(3) mechanics, conventions, and GTSAM 4.3.0 cross-validation
derivation: docs/01_conventions_and_gal3.md
conventions:
  group: X(R,v,p,t) = [[R, v, p], [0_1x3, 1, t], [0_1x3, 0, 1]], 5x5, R in SO(3); column 3 = velocity,
    column 4 = position, time at entry (3,4).
  algebra: xi = (phi, u, w, alpha) in R^10; xi^ = [[ [phi]x, u, w ], [0,0,alpha], [0,0,0]]; block order
    (rot, vel, pos, time).
  bias: b = [b_g ; b_a] (gyro first) throughout this project.
  gravity: g in the world frame; all claims hold for arbitrary g unless they name a numeric value. Tests
    use g = (0, 0, -9.81).
  rng: 'All sample counts are independent draws from numpy.random.default_rng with a fixed, recorded seed.
    Random rotations: Exp_SO3 of N(0, I3) unless a |phi| range is stated. Random v, p ~ N(0, I3) scaled
    as stated; random t ~ N(0,1).'
claims:
- id: M1-C01
  statement: For all X1=(R1,v1,p1,t1), X2=(R2,v2,p2,t2) in Gal(3), the 5x5 matrix product equals (R1R2,
    v1+R1v2, p1+R1p2+v1*t2, t1+t2).
  source: DERIVED (block multiplication); pre-flight F4
  kind: DERIVED
  test_hint: '2000 random pairs (R from Exp_SO3(N(0,I)), v~N(0,I), p~3*N(0,I), t~N(0,1)). Compare the
    5x5 matrix product against the closed form entrywise. max abs err <= 1e-12 (measured 3.6e-15). The
    v1*t2 term is load-bearing: a test that only uses t2=0 does not bind this claim.'
  domain: Total. No restriction.
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C02
  statement: 'Gal(3) is closed under the matrix product: for random X1, X2 the product P satisfies P[0:3,0:3]
    in SO(3) (P_R^T P_R = I, det = +1), P[3,0:3] = 0, P[4,0:4] = 0, P[3,3] = 1, P[4,4] = 1.'
  source: DERIVED
  kind: DERIVED
  test_hint: 2000 random pairs as in M1-C01. max over all structural residuals <= 1e-12 (measured 1.6e-15).
  domain: Total.
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C03
  statement: 'The Gal(3) product is associative: (X1 X2) X3 = X1 (X2 X3) entrywise, including the time
    block.'
  source: DERIVED
  kind: DERIVED
  test_hint: 2000 random triples. max abs err <= 1e-10 (measured 3.6e-15). Must be run through the IMPLEMENTATION's
    compose(), not through numpy matmul, or it tests nothing.
  domain: Total.
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C04
  statement: 'I5 = (I, 0, 0, 0) is a two-sided identity: I5 X = X I5 = X for all X in Gal(3).'
  source: DERIVED
  kind: DERIVED
  test_hint: 2000 random X. max abs err <= 1e-14 (measured 0.0 exactly).
  domain: Total.
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C05
  statement: 'X^-1 = (R^T, -R^T v, -R^T (p - t v), -t) is a two-sided inverse: X X^-1 = X^-1 X = I5, and
    in particular the (3,4) time entry of X X^-1 is exactly 0.'
  source: DERIVED; pre-flight F4
  kind: DERIVED
  test_hint: '2000 random X (including |t| up to ~3). max abs err of both products vs I5 <= 1e-10
    (measured 1.07e-14, test seed 20241012+5, 2000 draws); |(X X^-1)[3,4]| <= 1e-12 (measured 0.0). A test
    must include nonzero t AND nonzero v, or the -R^T(p - t v) term is untested.'
  domain: Total. R^T always exists.
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C06
  statement: 'Gal(3) is non-abelian: there exist X1, X2 with max|X1 X2 - X2 X1| >= 1e-3.'
  source: DERIVED
  kind: DERIVED
  test_hint: 'Over 200 random pairs from the fixed-seed stream (seed 20241012+6, rand_gal) assert max|X1
    X2 - X2 X1| >= 1e-3; measured worst commutator difference 16.15 (verifier 16.15 at the same seed).
    This rejects an implementation whose compose() is accidentally additive/commutative.'
  domain: Total.
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C07
  statement: 'The time block is additive under composition: t(X1 X2) = t1 + t2 exactly, and t(X^-1) =
    -t exactly.'
  source: DERIVED
  kind: DERIVED
  test_hint: 2000 random pairs. abs err <= 1e-12 (measured 0.0). Stated separately from M1-C01 because
    the project's prior math contract was wrong specifically in this entry.
  domain: Total.
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C08
  statement: 'wedge and vee are mutually inverse: vee(wedge(xi)) = xi for all xi in R^10, and wedge(vee(A))
    = A for all A in gal(3), with wedge placing u in matrix column 3 (velocity) and w in column 4 (position).'
  source: DERIVED
  kind: DERIVED
  test_hint: 2000 random xi ~ N(0,I10). max abs err <= 1e-14 (measured 0.0). Also assert wedge(e4)[0:3,3]
    = e1 and wedge(e7)[0:3,4] = e1 to pin the (vel, pos) block order, 0-indexed e3..e5 -> velocity, e6..e8
    -> position.
  domain: Total.
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C09
  statement: ad_xi for xi = (phi,u,w,alpha) is the 10x10 matrix with blocks [[ [phi]x,0,0,0 ],[ [u]x,[phi]x,0,0
    ],[ [w]x, -alpha*I3, [phi]x, u ],[ 0,0,0,0 ]], and wedge(ad_xi eta) = xi^ eta^ - eta^ xi^ for all
    xi, eta.
  source: DERIVED
  kind: DERIVED
  test_hint: 2000 random (xi, eta) ~ N(0,I10). max abs err of the commutator identity <= 1e-10 (measured
    1.8e-15). Separately assert the last row of ad_xi is identically zero and the (6:9, 9) column equals
    u.
  domain: Total.
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C10
  statement: 'ad is a Lie-algebra homomorphism and the bracket satisfies Jacobi: ad_{ad_xi eta} = ad_xi
    ad_eta - ad_eta ad_xi, and ad_x(ad_y z) + ad_y(ad_z x) + ad_z(ad_x y) = 0.'
  source: DERIVED
  kind: DERIVED
  test_hint: 2000 random pairs/triples ~ N(0,I10). max abs err <= 1e-12 (measured 3.6e-15 and 1.1e-14).
  domain: Total.
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C11
  statement: Ad_X(xi) = vee(X xi^ X^-1) has the closed form phi' = R phi; u' = R u + [v]x R phi; w' =
    R w - t R u + [p - t v]x R phi + alpha v; alpha' = alpha.
  source: DERIVED; pre-flight F8
  kind: DERIVED
  test_hint: '2000 random (X, xi), X with nonzero t and v. Compare wedge(Ad_X xi) against X wedge(xi)
    X^-1: max abs err <= 1e-9 (measured 1.1e-14). The -t R u term requires t != 0 in the test set.'
  domain: Total.
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C12
  statement: 'Ad is a group homomorphism: Ad_{X Y} = Ad_X Ad_Y as 10x10 matrices.'
  source: DERIVED
  kind: DERIVED
  test_hint: 2000 random pairs. max abs err <= 1e-8 (measured 7.1e-15).
  domain: Total.
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C13
  statement: Ad_{X^-1} = (Ad_X)^-1 as 10x10 matrices, i.e. the closed form of M1-C11 evaluated at X^-1
    equals the numerical inverse of Ad_X.
  source: DERIVED
  kind: DERIVED
  test_hint: 2000 random X. max abs err <= 1e-8 (measured 1.3e-14). Ad_X is never singular (det = 1, see
    M1-C17).
  domain: Total.
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C14
  statement: 'Ad-ad compatibility: Ad_X ad_xi (Ad_X)^-1 = ad_{Ad_X xi} for all X in Gal(3) and xi in gal(3);
    equivalently Ad_X(ad_xi(eta)) = ad_{Ad_X xi}(Ad_X eta).'
  source: DERIVED
  kind: DERIVED
  test_hint: 2000 random (X, xi, eta) with xi, eta ~ 0.5*N(0,I10). max abs err <= 1e-7 for both forms
    (measured 1.8e-14 and 2.1e-14).
  domain: Total.
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C15
  statement: Ad_{exp(xi)} = expm(ad_xi), where expm is the 10x10 matrix exponential.
  source: DERIVED
  kind: DERIVED
  test_hint: 500 random xi ~ 0.6*N(0,I10) with |phi| drawn in (0.05, 2.9). max abs err <= 1e-8 (measured
    1.8e-14).
  domain: Total, but the numerical test should keep ||xi|| <= ~3 so that expm is well conditioned.
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C16
  statement: 'The time coordinate is Ad-invariant: the last row of Ad_X equals e_10^T for every X, i.e.
    alpha'' = alpha exactly, independent of (R, v, p, t).'
  source: DERIVED; pre-flight F8
  kind: DERIVED
  test_hint: 2000 random X. max abs deviation of Ad_X[9,:] from (0,...,0,1) <= 1e-14 (measured 0.0).
  domain: Total.
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C17
  statement: 'Gal(3) is unimodular: det(Ad_X) = 1 for every X, and trace(ad_xi) = 0 for every xi.'
  source: DERIVED
  kind: DERIVED
  test_hint: '500 random X: |det(Ad_X) - 1| <= 1e-12 (measured 2.9e-15). 500 random xi: |trace(ad_xi)|
    <= 1e-14 (measured 0.0).'
  domain: Total.
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C18
  statement: With theta = ||phi|| and Phi = [phi]x, Gamma1(phi) = I + kappa1 Phi + kappa2 Phi^2 and Gamma2(phi)
    = (1/2) I + kappa2 Phi + kappa3 Phi^2, where kappa1 = (1-cos theta)/theta^2, kappa2 = (theta - sin
    theta)/theta^3, kappa3 = (theta^2 + 2 cos theta - 2)/(2 theta^4); equivalently Gamma_m(phi) = sum_{n>=0}
    Phi^n/(n+m)!.
  source: DERIVED (Delama et al. present the same Gamma1/Gamma2, kappa1..3 form; equation numbers could
    not extract)
  kind: DERIVED
  test_hint: '2000 random phi with |phi| in (1e-3, 3.0): compare the kappa form against the truncated
    series sum_{n=0..40} Phi^n/(n+m)!; max abs err <= 1e-12 (measured 2.5e-14 over 2000 samples).'
  domain: theta > 0; at theta = 0 the limits are Gamma1 = I, Gamma2 = I/2. See M1-C24 for the small-angle
    branch.
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C19
  statement: exp(phi, u, w, alpha) = (Exp_SO3(phi), Gamma1(phi) u, Gamma1(phi) w + alpha Gamma2(phi) u,
    alpha), and this equals scipy.linalg.expm(wedge(xi)) entrywise.
  source: DERIVED
  kind: DERIVED
  test_hint: '2000 random xi with |phi| drawn uniformly in (0.05, 2.9), u, w ~ N(0,I3), alpha ~ N(0,1)
    (seed 20241012+19). max abs err vs expm <= 1e-9 (measured 3.8e-15; verifier 1.5e-13 over 1e4 draws
    including theta < 0.05 and up to 2 pi - 0.3). alpha != 0 and u != 0 are both required or the
    alpha*Gamma2*u coupling is untested.'
  domain: Total on gal(3).
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C20
  statement: 'The time block of exp(xi) equals alpha exactly: exp(xi)[3,4] = alpha, not merely to first
    order.'
  source: DERIVED
  kind: DERIVED
  test_hint: 2000 random xi including |alpha| up to ~3. abs err <= 1e-12 (measured 0.0).
  domain: Total.
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C21
  statement: log(R,v,p,t) = (phi, u, w, alpha) with phi = Log_SO3(R), u = Gamma1(phi)^-1 v, w = Gamma1(phi)^-1
    (p - t Gamma2(phi) u), alpha = t, where Gamma1(phi)^-1 = I - Phi/2 + c2(theta) Phi^2 and c2(theta)
    = (1 - theta sin(theta) / (2 (1 - cos theta))) / theta^2.
  source: DERIVED
  kind: DERIVED
  test_hint: '20000 random phi with |phi| in (1e-9, pi] (seed 20241012+21): max abs of Gamma1inv(phi) @
    Gamma1(phi) - I <= 1e-9 (measured 9.8e-10 WITHOUT the small-angle branch, dominated by the |phi| ~
    1e-6 samples; WITH the M1-C24 Taylor branch, measured 1.8e-14 at the test seed -- assert <= 1e-13).
    The equivalent form c2 = 1/theta^2 - (1+cos theta)/(2 theta sin theta) must NOT be used: assert
    finiteness of c2 at theta = pi exactly and relative accuracy <= 1e-13 against 60-digit arithmetic at
    theta = pi and pi - 10^-k, k = 3..9 (measured 1.0e-16); the forbidden form in src fails that bound
    (mutation harness: c2_forbidden_form).'
  domain: Requires Gamma1(phi) invertible, i.e. theta != 2*pi*k. Log_SO3 requires theta < pi for a unique
    branch.
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C22
  statement: log(exp(xi)) = xi for every xi in gal(3) with ||phi|| < pi.
  source: DERIVED
  kind: DERIVED
  test_hint: 2000 random xi with |phi| uniform in (0.05, pi - 1e-3), u, w ~ N(0,I3), alpha ~ N(0,1). max
    abs err <= 1e-9 (measured 5.6e-15). Also assert it FAILS (returns the other branch) for |phi| > pi,
    e.g. |phi| = 3.5 returns |phi'| = 2*pi - 3.5 = 2.783.
  domain: '||phi|| < pi. At ||phi|| = pi the SO(3) log is two-valued; above pi, log returns the wrapped
    branch.'
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C23
  statement: exp(log(X)) = X for EVERY X in Gal(3) (exp is surjective onto Gal(3)), including rotations
    with |phi| arbitrarily close to pi.
  source: DERIVED
  kind: DERIVED
  test_hint: '5000 random X with R = Exp_SO3(5*N(0,I3)) (so the wrapped |phi| covers (0, pi]), v, p ~
    N(0,I3), t ~ N(0,1), seed 20241012+23. max abs err <= 1e-9 (measured 1.48e-13; verifier 1.49e-13).'
  domain: Total. Surjectivity holds because Gamma1 is invertible on [0, pi].
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C24
  statement: Gamma1(phi) is invertible for all theta in [0, 2*pi), with det Gamma1 = 1.0 at theta = 0,
    0.4053 at theta = pi, 2.21e-3 at theta = 6.0, and 0 at theta = 2*pi; cond(Gamma1) at theta = pi is
    pi/2 = 1.5708. The implementation switches to the 3-term Taylor branch kappa1 = 1/2 - th^2/24 + th^4/720,
    kappa2 = 1/6 - th^2/120 + th^4/5040, kappa3 = 1/24 - th^2/720 + th^4/40320, c2 = 1/12 + th^2/720 +
    th^4/30240 for theta < 5e-2.
  source: DERIVED + measured
  kind: DERIVED
  test_hint: 'Assert the four tabulated det/cond values to 4 significant figures. Then assert max relative
    error of each coefficient against 60-digit mpmath arithmetic <= 1e-11 over theta in {1e-9, 1e-6, 1e-4,
    1e-2, 5e-2, 1e-1, 1.0, 3.0} (measured 8.2e-13) -- this FAILS if the Taylor branch is absent from src
    (mutation harness: taylor_branch_removed; without the branch the 2 sin^2 closed form has relative
    error 1.0 in kappa2, kappa3 and c2 at theta = 1e-9, and 1.8e-7 / 8.3e-8 in kappa3 / c2 at theta =
    1e-4).'
  domain: 'Gamma1 singular exactly at theta = 2*pi*k, k >= 1. Closed-form kappa3 and c2 lose all precision
    below theta ~ 1e-4. Stated constraint on the switch point: THETA_SMALL = 5e-2 is load-bearing. Just
    below the switch the binding error is the 3-term Taylor truncation (relative error ~ theta^6), not the
    1 - cos(theta) cancellation: kappa1''s truncation is 7.75e-13 at theta = 5e-2 and would be 1.30e-11 at
    8e-2 (crossing 1e-11 near 7.7e-2), so the switch cannot be moved up to 8e-2 without breaking the 1e-11
    bound (mutation harness: theta_small_8e-2, caught by the dense sweep). Just above the switch, 1 -
    cos(theta) must be evaluated as the identically equal 2 sin^2(theta/2): the literal form gives kappa3
    and c2 relative errors of ~2e-10 just above 5e-2 (1.6e-10 / 1.6e-10 at the test''s sweep points >=
    5e-2; 1.9e-10 / 1.9e-10 over 500 points on [0.05, 0.06]; verifier 6.1e-10 / 2.0e-10 on its own
    points), while 2 sin^2 keeps every coefficient within 1.11e-12 on the test''s dense sweep (theta in
    1e-12..10, 863 points, series-defined 50-digit reference; measured 1.106e-12) and within 1.41e-12 on a
    denser 6003-point sweep (logspace(1e-12, 10, 3000), linspace(0.045, 0.2, 3000), pi and both sides of
    5e-2; verifier 1.36e-12 on its own 6003 points) -- 7x under the 1e-11 bound.'
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C25
  statement: Cay(xi) = (I5 - xi^/2)^-1 (I5 + xi^/2) has the closed form (S^-1 (I + [phi]x/2), S^-1 u,
    S^-1 (w + (alpha/2) u), alpha) with S = I - [phi]x/2.
  source: DERIVED (generalises pre-flight F3 to alpha != 0)
  kind: DERIVED
  test_hint: 2000 random xi with |phi| in (0.05, 2.9), u, w ~ N(0,I3), alpha ~ N(0,1). max abs err vs
    the explicit 5x5 Cayley <= 1e-9 (measured 8.9e-16). alpha != 0 AND u != 0 are REQUIRED; at alpha =
    0 the term under test vanishes identically.
  domain: Total on gal(3) (see M1-C26).
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C26
  statement: det(I5 - xi^/2) = 1 + ||phi||^2 / 4 > 0 for every xi in gal(3); hence Cayley is total on
    gal(3) -> Gal(3) and its sole denominator never vanishes.
  source: DERIVED; pre-flight F8
  kind: DERIVED
  test_hint: '2000 random xi, including |alpha| up to ~3 and large |u|, |w| (seed 20241012+26). Assert the
    MATRIX cay_denominator(xi) = I5 - xi^/2 entrywise, with xi^ written by hand in the test (measured 0.0)
    -- I5 + xi^/2 has the same determinant 1 + |phi|^2/4, so a determinant-only check cannot see that sign
    (mutation harness: cay_denominator_minus->plus). max |det - (1 + |phi|^2/4)| <= 1e-10 (measured
    8.9e-16). Also 20000 Cayley evaluations with nonzero alpha, |phi| up to 50 and |u|, |w| ~ 1e3 (seed
    20241012+2600): finite, equal to the defining (I5 - xi^/2)^-1 (I5 + xi^/2) (rel 2.4e-15), and (I5 -
    xi^/2) Cay(xi) = I5 + xi^/2 (rel 5.5e-15).'
  domain: Total. The determinant is independent of u, w, alpha -- only phi enters.
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C27
  statement: 'Cay(xi) lands in Gal(3): its rotation block Re satisfies Re^T Re = I and det Re = +1 automatically
    (no determinant constraint is needed), and its time block equals alpha exactly.'
  source: DERIVED; pre-flight F3
  kind: DERIVED
  test_hint: 2000 random xi. max orthogonality/det residual <= 1e-10 (measured 6.7e-16); |Cay(xi)[3,4]
    - alpha| <= 1e-12 (measured 0.0).
  domain: Total.
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C28
  statement: The rotation Cay([c]x) has axis c/||c|| and angle theta with ||c|| = 2 tan(theta/2); numerically
    ||c|| = 0.5107 at theta = 0.5, 1.0926 at 1.0, 3.1148 at 2.0, 28.203 at 3.0, 4.3172e4 at 3.1415 rad.
  source: DERIVED; pre-flight F3
  kind: DERIVED
  test_hint: '2000 random c with ||c|| uniform in (0.01, 5.0) (seed 20241012+28): | ||c|| - 2 tan(theta/2)
    | <= 1e-8 where theta = ||Log_SO3(Cay([c]x))|| (measured 6.2e-15); 2000 more with ||c|| log-uniform in
    (5, 5e4), angle read back with scipy: <= 1e-9 (measured 8.0e-13). The five tabulated values are
    checked THROUGH cay: Cay of the tabulated ||c|| must return theta within the tolerance implied by 4
    significant figures, axis preserved to 1e-9.'
  domain: Cayley cannot represent theta = pi and is numerically unusable for theta > ~3 rad. Absolute
    rotations R_i, R_j must NOT be Cayley-parameterised.
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C29
  statement: 'Cayley and exp agree to second order and differ at third: log(Cay(s*xi)) = s*xi + (s^3/12)
    vee((xi^)^3) + O(s^5); in particular ||log(Cay(s*xi)) - s*xi|| / s^3 stays bounded as s -> 0 and the
    residual after subtracting the s^3 term scales as s^5.'
  source: DERIVED
  kind: DERIVED
  test_hint: '300 unit-norm xi (||xi||_2 = 1), s in {1e-1, 5e-2}: max over samples of ||log(Cay(s xi))
    - s xi||_inf / s^3 <= 1.0 (measured 0.052). Then 300 unit xi at s = 1e-2: max of ||log(Cay(s xi))
    - s xi - (s^3/12) vee((xi^)^3)||_inf / s^5 <= 1.0 (measured 7.1e-3). A test that only asserts ''the
    difference is small'' does not bind this claim -- the SCALING must be checked.'
  domain: Asymptotic as s -> 0; the s^5 remainder test is meaningful only for s <= ~0.05 in double precision.
  verdict: CONFIRMED
  attack: see docs/verification/m1-gal3-mechanics.md
- id: M1-C30
  statement: 'The Cayley residual admits a degree-<=2 constraint block in the independently lifted variables
    (phi, Re, ve, pe, u, w, alpha): (I - [phi]x/2) Re = I + [phi]x/2, (I - [phi]x/2) ve = u, and (I -
    [phi]x/2) pe = w + (alpha/2) u.'
  source: 'DERIVED (first two and the alpha=0 case of the third: pre-flight F3; the (alpha/2) u coupling
