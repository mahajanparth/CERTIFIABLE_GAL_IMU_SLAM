    extract" (the Q_d definition is an unnumbered Define: line of Algorithm 1, not a numbered equation).'
  source: Delama et al. Sec. IV-C; Algorithm 1, Q_d definition (unnumbered)
  kind: VERIFIED-PUBLISHED
  test_hint: Assert all five fields. The eq entry MUST be exactly the string "could not extract" -- any
