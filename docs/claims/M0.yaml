  statement: CONVENTIONS["delama"]["error_handedness"] == "right-invariant" (navigation error Upsilon_k
    Upsilon_hat_k^-1, eq "34") with bias_correction_side == "left" (eq "39"); and CONVENTIONS["gtsam"]["error_handedness"]
