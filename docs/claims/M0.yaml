  statement: 'CONVENTIONS["delama"]["bias_order"] == ("b_omega","b_a","b_nu","b_rho") with bias_dim ==
    10, bias_virtual_slices == (slice(6,9), slice(9,10)) naming a VIRTUAL VELOCITY bias and a VIRTUAL
