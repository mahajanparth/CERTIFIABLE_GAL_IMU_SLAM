  kind: VERIFIED-PUBLISHED
  test_hint: 'Assert all four values and that delama != gtsam on each axis. Guard against eq-label collision:
    the label "34" appears in BOTH sources meaning different equations, so the test must read it out of
    the per-source dict and must NOT compare eq strings across rows. Add an explicit assertion that CONVENTIONS["delama"]["eq"]["error_local_coords"]
