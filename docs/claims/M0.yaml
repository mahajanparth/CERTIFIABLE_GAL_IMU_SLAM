- id: M0-C12
  statement: CONVENTIONS["barfoot"]["rank1_criterion"] records the log-SVR test log10(sigma_1 / sigma_2)
    >= 5 with eq["rank1_criterion"] == "could not extract"; CONVENTIONS["barfoot"]["tightness_degrades_with"]
    contains "measurement sparsity" with eq["sparsity"] == "could not extract"; and CONVENTIONS["rai"]["rank1_criterion"]
    records the DIFFERENT test "eigenvalues above 1e-6 * lambda_max" -- the two criteria are recorded
    as distinct and are not aliased to one another.
  source: Barfoot et al. Sec. 3 prose and the captions of Figs. 2, 4, 5, 9, 12; Sec. 5 prose (Fig. 12
    vs Fig. 9); Rai et al. Sec. VII-A
  kind: VERIFIED-PUBLISHED
  test_hint: 'Assert the threshold value 5 (base-10 log of a SINGULAR-value ratio, i.e. 1e5) and that
    both barfoot eq entries are exactly "could not extract". Assert CONVENTIONS["rai"]["rank1_criterion"]
    != CONVENTIONS["barfoot"]["rank1_criterion"]. Numerical anchor, with the disagreement in the RIGHT
    direction: Rai''s cut is at 1e-6 relative, Barfoot''s at 1e-5 relative, so they differ on ratios between
    1e5 and 1e6. Build a symmetric PSD 10x10 with eigenvalues (1.0, 10**-5.5, 1e-9, ...): Barfoot''s rule
    ACCEPTS it as rank 1 (log-SVR 5.5 >= 5) while Rai''s rule REJECTS it (10**-5.5 = 3.2e-6 is above 1e-6*lambda_max,
    so the numerical rank is 2). Assert both outcomes.'
  domain: Barfoot's criterion is on singular values of the SDP solution X; Rai's is on eigenvalues of
    Z_hat. Both are numerical-rank heuristics, not proofs.
  verdict: CONFIRMED
  attack: see docs/verification/m0-literature-matrix.md
- id: M0-C13
  statement: 'INCOMPATIBILITIES contains keys "O1".."O7", and each of the following holds against the
    INSTALLED gtsam 4.3.0 as well as against the recorded table: O1 Gal3 matrix column 4 is velocity while
    Gal3(R, r, v, t) takes position second; O2 Gal3 tangent is (omega, nu, rho, alpha) while NavState
    tangent is (dtheta, dp, dv), so the 9-of-10 map P_N (GTSAM doc eq "38") selects Gal3 rows [0:3, 6:9,
    3:6]; O3 imuBias::ConstantBias.vector() is [b_a; b_omega] while this project fixes [b_g; b_a]; O4
    integrateMeasurement takes (acc, omega); O5 Barfoot SE(3) tangent is [rho; phi] (translation first,
    eq "10"); O6 the letters r/rho denote position in gtsam/barfoot but the position SLOT in delama; O7
    the gravity position block is -0.5*g*dt^2 in the Gal(3) left factor and +0.5*g*dt^2 in the SE_2(3)
    NavState factor W_ij.'
  source: GTSAM galileanimufactor Eqs. (1), (2), (5), (10), (15), (20), (37), (38); Barfoot et al. Eq.
    (10); Delama et al. Eqs. (4), (18); runtime inspection of gtsam 4.3.0
  kind: VERIFIED-PUBLISHED
  test_hint: Runtime, not just table lookup. (O1) gtsam.Gal3(Rot3.Identity(), [1,2,3], [10,20,30], 7.0).matrix()
    must put [10,20,30] in column index 3 and [1,2,3] in column index 4. (O2) for i in 3..5, gtsam.Gal3.Hat(e_i)
    must be nonzero in column 3 while NavState().retract(e_i) must move position; assert the recorded
    P_N row selection [0,1,2,6,7,8,3,4,5]. (O3) imuBias.ConstantBias([1,2,3],[40,50,60]).vector() == [1,2,3,40,50,60].
    (O5)-(O6) table assertions. (O7) assert the two recorded sign values differ and that INCOMPATIBILITIES["O7"]["reason"]
    names the Galilean t2*v1 coupling term of GTSAM eq "3" -- it is a consequence of the group law, not
    a contradiction.
  domain: gtsam 4.3.0 exactly; re-run on any version bump. The doc pages carry no version banner.
  verdict: CONFIRMED
  attack: see docs/verification/m0-literature-matrix.md
- id: M0-C14
  statement: CONVENTIONS["gtsam"]["eq"]["endpoint"] == "17" recording X_j = W_ij . phi_{dt_ij}(X_i) .
    U_ij(beta_i) with W_ij = NavState(I, 0.5*g*dt^2, g*dt) (eq "15"), phi_dt(R,p,v) = (R, p + v*dt, v)
    (eq "15"), U_ij = NavState(dR, dp, dv) (eq "16") -- and NOT the form H_ij X_i D_ij; this is verified
    at runtime to <= 1e-12 against gtsam's own predictor, while the coasting-free variant W_ij . X_i .
    U_ij is verified to be WRONG by more than 1e-2 in NavState local coordinates.
  source: GTSAM galileanimufactor Eqs. (15), (16), (17)
  kind: VERIFIED-PUBLISHED
  test_hint: params = PreintegrationParams.MakeSharedU(9.81) (gives g = [0,0,-9.81]); build PreintegratedImuMeasurementsG
    at a nonzero bias; integrate >= 50 samples with nonzero acc and omega over the dt_ij the domain pins.
    X_j = pim.predict(X_i, bias) for a nontrivial X_i whose velocity satisfies the domain's floor. Assert
    norm(X_j.localCoordinates(W.compose(phi).compose(U))) <= 1e-12 AND norm(X_j.localCoordinates(W.compose(X_i).compose(U)))
    > 1e-2. The second error is exactly ||v_i|| * dt_ij, which is why the domain pins both; it is what
    makes the claim falsifiable -- without it a trivially-equal U would pass.
  domain: 'Inertial navigation frame (omegaCoriolis unset); the rotating-frame form is eq (47) and is
    out of Stage B scope. W_ij uses NavState(R, p, v) argument order. The > 1e-2 bar holds only in the
    regime dt_ij ~ 0.5 s with ||v_i|| > 0.1 m/s: the coasting-free error is exactly ||v_i|| * dt_ij, so
    it falls below 1e-2 at dt_ij <= 0.09 s for ||v_i|| = 0.11.'
  verdict: CONFIRMED
  attack: see docs/verification/m0-literature-matrix.md
- id: M0-C15
  statement: Delama Eq. (18)'s Gamma_ij equals the pre-flight F2 corrected left factor T(-dt) @ H' EXACTLY
    (zero difference), where H' = [[I, g*dt, -0.5*g*dt^2],[0,1,0],[0,0,1]] and T(-dt) = [[I,0,0],[0,1,-dt],[0,0,1]];
    and the right-multiplied variant H' @ T(-dt) is NOT equal to Gamma_ij. The project's corrected endpoint
    relation therefore reproduces a published equation rather than merely passing a numerical test.
  source: DERIVED from Delama et al. Eq. (18) and docs/00_preflight_findings.md F2
  kind: DERIVED
  test_hint: For >= 100 random (g, dt) inside the domain, build Gamma_ij directly from Delama Eq. (18)
    and build T(-dt) @ H' from the F2 forms; assert numpy.array_equal(Gamma, T @ Hp) (zero difference,
    not merely small). Then assert norm(Gamma - Hp @ T) > 1e-6 -- side placement is load-bearing. The
    reversed-product error is exactly ||g||*dt^2, so the 1e-6 bar is a property of the domain's dt floor,
    not of dt != 0 alone. A test that only checks the first half would pass for a commuting pair and is
    insufficient.
  domain: 5x5 Gal(3) matrices with |dt| >= 0.05 and ||g|| >= 1 (so ||g||*dt^2 >= 2.5e-3 clears the 1e-6
    bar; at ||g|| = 9.81 the reversed error drops below 1e-6 for |dt| <= 3.2e-4, e.g. a 10 kHz sample
    interval). Exactness (not tolerance) is expected because both expressions are built from the same
    literals.
  verdict: CONFIRMED
  attack: see docs/verification/m0-literature-matrix.md
