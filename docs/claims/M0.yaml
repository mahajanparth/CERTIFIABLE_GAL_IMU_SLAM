milestone: M0
claims:
- id: M0-C01
  statement: CONVENTIONS["rai"] records group == "SO(3)" with velocity and position as plain R^3 variables
    (element_order is None and tangent_order is None, since rai has no 5x5 group element), AND a case-sensitive
    scan of the archived rai source text finds exactly zero occurrences of each of "Galilean", "SE_2",
    "\\mathrm{SE}", "SE}_{2", "extended pose", "equivariant", "Equivariant", "Delama", "Fornasier", "Weiss",
    while "Barfoot" occurs at least once (reference [6]).
  source: Rai et al. Eqs. (3), (15), (21b), (21c), (36); full-text scan of arXiv:2609.38048v1
  kind: VERIFIED-PUBLISHED
  test_hint: 'Assert the CONVENTIONS["rai"] fields. For the scan, fetch https://arxiv.org/html/2609.38048v1,
    strip <script>/<style>, and count raw substrings in the HTML (counts must be computed on the HTML,
    not on a MathML-stripped rendering, so LaTeX spellings are caught). Expected counts: all of the listed
    Galilean/Delama terms == 0; "Barfoot" >= 1; "Mahony" == 1 (reference [3] only, not a Delama citation).
    Cache the fetched text under a test fixture so the test is not network-flaky; if the network is unavailable
    the test must FAIL, not skip.'
  domain: arXiv v1 of 29 Sep 2026 only; a later version could add citations.
  verdict: CONFIRMED
  attack: see docs/verification/m0-literature-matrix.md
- id: M0-C02
  statement: CONVENTIONS["rai"]["eq"]["rotation_residual"] == "19", and the recorded residual is r^R_ij
    = (R_j - R_i dRbar_ij) - (1/2)(R_j + R_i dRbar_ij) xi_ij^ with xi_ij = J^R_ij * delta_b_g where delta_b_g
    = b_g - bbar_g is the bias PERTURBATION (not the full bias); the coefficient on the second term is
    exactly -1/2 and the first term carries a minus sign.
  source: Rai et al. Eq. (19); restated Eq. (21a); xi_ij defined in Eq. (15)
  kind: VERIFIED-PUBLISHED
  test_hint: 'Assert eq label == "19". Then assert a recorded structured form, e.g. CONVENTIONS["rai"]["rotation_residual"]
    == {"terms": [(+1,"R_j"), (-1,"R_i dRbar"), (-0.5,"(R_j + R_i dRbar) xi^")], "xi_uses": "delta_b_g"}.
    A test that only checks the string "19" is insufficient -- the sign and the delta_b_g-vs-b_g distinction
    must both be decided.'
  domain: First-order bias model; Cayley pre-integrated dRbar_ij, not the Exp one.
  verdict: CONFIRMED
  attack: see docs/verification/m0-literature-matrix.md
- id: M0-C03
  statement: 'Rai Eq. (22b) is algebraically IDENTICAL to Eq. (19), not an approximation: for Gamma_ij
    = (J^R_ij * bbar_g)^ and Rbreve_ij = dRbar_ij (I - Gamma_ij/2) and Y_ij = R_i dRbar_ij (J^R_ij b_g)^
    and Yprime_ij = R_j (J^R_ij b_g)^, the quantity R_j (I + Gamma_ij/2) - R_i Rbreve_ij - (1/2)(Y_ij
    + Yprime_ij) equals (R_j - R_i dRbar_ij) - (1/2)(R_j + R_i dRbar_ij) (J^R_ij (b_g - bbar_g))^ to 1e-12
    for 1e4 random draws.'
  source: DERIVED from Rai et al. Eqs. (19), (22a), (22b), (22c)
  kind: DERIVED
  test_hint: 'Draw 1e4 independent samples: R_i, R_j, dRbar uniform on SO(3) (scipy Rotation.random);
    J^R a 3x3 standard-normal matrix (it need NOT be a valid Jacobian for the identity to hold); b_g,
    bbar_g standard-normal 3-vectors; repeat with J^R and both biases scaled by 1, 1e-8 and 1e4. Compute
    both expressions and assert the max elementwise difference, RELATIVE to max(1, max elementwise |Eq.
    (19)|) per draw, is < 1e-12. The bar must be relative: the absolute floating-point difference grows
    with |J^R||b_g| (4.8e-7 at the 1e4 scale) while the relative one stays at machine level. If this fails,
    the lifting in Eq. (28) is NOT exact and every downstream QCQP claim is void.'
  domain: Pure algebra -- holds for arbitrary 3x3 J^R and arbitrary b_g; no small-angle or chart restriction.
    The 1e-12 bar is relative to max(1, max|Eq. (19)|), since an absolute bar cannot hold at arbitrary
    scale in floating point.
  verdict: CONFIRMED
  attack: see docs/verification/m0-literature-matrix.md
- id: M0-C04
  statement: CONVENTIONS["rai"]["eq"]["lifted_vector"] == "28" and the recorded lifted decision vector
    is exactly the ordered list [vec(R_i), v_i, p_i] per keyframe, [b_m] per bias block, [vec(Y_ij), vec(Y'_ij),
    W^v_ij, W^p_ij] per IMU edge, and the single homogenising scalar s LAST; and CONVENTIONS["rai"]["eq"]["homogeniser"]
    == "31" recording s**2 == 1 together with the primary rotation constraints R_i^T R_i == s**2 * I_3
    and the cross-product handedness R_i^(a) x R_i^(b) == s * R_i^(c) over cyclic (a,b,c).
  source: Rai et al. Eq. (28); Eqs. (22c), (26a), (26b) for the auxiliary definitions; Eq. (31)
  kind: VERIFIED-PUBLISHED
  test_hint: Assert the recorded block sequence as a tuple of (scope, name) pairs, including that "s"
    is the final entry. Separately assert that the recorded primary-constraint set for Eq. (31) contains
    all THREE families (s^2=1, column orthonormality, cross-product handedness) -- omitting handedness
    admits det = -1 spurious points (pre-flight F3).
  domain: Absolute rotations R_i only; the Cayley residual rotation needs no determinant constraint (pre-flight
    F3).
  verdict: CONFIRMED
  attack: see docs/verification/m0-literature-matrix.md
- id: M0-C05
  statement: CONVENTIONS["rai"]["redundant_constraints"] maps A1->"32", B1->"33", B2->"34", C1->"35" with
    cardinalities A1 == "6/node", B1 == "3/lifting", C1 == "2/edge" and B2 == "could not extract"; and
    CONVENTIONS["rai"]["ablation"] records total_solves == 840, gap_through_B1_at_least == 0.88, certified_through_B1
    == "0/504", median_gap_full_set == 2.8e-5, and decisive_subset == "B2".
  source: Rai et al. Eqs. (32), (33), (34), (35), Table I, Sec. VII-B
  kind: VERIFIED-PUBLISHED
  test_hint: 'Assert the four id->equation strings, the four cardinality strings (B2 MUST be the literal
    "could not extract" -- the paper gives no per-edge count for it), and the five ablation values (floats
    to exact equality as written; they are quoted figures, not measurements). Also assert decisive_subset
    == "B2": A1+B1 alone certify nothing.'
  domain: Synthetic K=8, M=2, n=340; 2 primitives x 7 noise levels x 12 seeds x 5 cumulative stages.
  verdict: CONFIRMED
  attack: see docs/verification/m0-literature-matrix.md
- id: M0-C06
  statement: CONVENTIONS["rai"]["eq"]["isotropic_weighting"] == "23" and CONVENTIONS["rai"]["isotropy_required"]
    is True with CONVENTIONS["rai"]["isotropy_reason"] recording the identity tau*||r||^2 == tau*||R_i
    r||^2 for R_i in SO(3) -- i.e. the isotropic weight is STRUCTURALLY FORCED by the device used to remove
    the rotation-state products, not a tuning choice.
  source: Rai et al. Eq. (23) and the preceding unnumbered display in Sec. IV-B
  kind: VERIFIED-PUBLISHED
  test_hint: 'Assert isotropy_required is True. Decide the recorded identity against the source: it must
    be, symbol for symbol, the unnumbered display the paper prints immediately before Eq. (23), followed
    by the sentence "This equality requires an isotropic weight", and Eq. (23) must define every weight
    as the SCALAR tau^-1 = (1/3) tr Sigma in the same symbol tau. (Edited 2026-10-12, M0-F08: the earlier
    hint asked for a numeric check that r^T W r == (R r)^T W (R r) fails for anisotropic W and holds for
    W = tau*I. That is a theorem about SO(3); it reads no table value and cannot fail, so it decides nothing
    about the table and was removed from the test.)'
  domain: Applies to the velocity and position residuals premultiplied by R_i (Eqs. 25a, 25b); drops cross-correlations
    of Sigma^f_ij.
  verdict: CONFIRMED
  attack: see docs/verification/m0-literature-matrix.md
- id: M0-C07
  statement: CONVENTIONS["delama"] records element_order == ("A","a","b","c") realised as the 5x5 matrix
    [[A, a, b],[0,1,c],[0,0,1]] at eq "3"; tangent_order == ("omega","v","r","alpha") at eq "4"; inverse
    at eq "5" equal to (A^T, -A^T a, -A^T (b - c a), -c); and the adjoint at eq "6" whose last row is
    [0,0,0,1] (the time coordinate is Ad-invariant).
  source: Delama et al. Eqs. (3), (4), (5), (6)
  kind: VERIFIED-PUBLISHED
  test_hint: 'Assert the four eq labels and the two ordering tuples. Cross-check the inverse formula numerically:
    build the 5x5 from random (A, a, b, c), apply the recorded Eq. (5) expression, and assert X @ X_inv
    == I_5 to 1e-12 over 1e4 draws. Also assert that the recorded Delama tangent_order is componentwise
    the SAME as CONVENTIONS["gtsam"] ["tangent_order"] == ("omega","nu","rho","alpha") -- the letters
    differ, the ordering does not.'
  domain: Matrix Lie group Gal(3); c is elapsed time, a is the velocity slot, b the position slot.
  verdict: CONFIRMED
  attack: see docs/verification/m0-literature-matrix.md
- id: M0-C08
  statement: CONVENTIONS["delama"]["group"] == "Gal(3) |x gal(3)" with state_dim == 20; eq["semidirect_product"]
    == "1" recording XY = (AB, a + Ad_A[b]); and action_handedness == "right" with eq["state_action"]
    == "24", citing the sentence IMMEDIATELY AFTER Eq. (24) ("phi is a transitive and free right group
    action of G on M").
  source: Delama et al. Eq. (1), Eq. (24) and the sentence following it; Sec. IV-C; Eqs. (35)-(37)
  kind: VERIFIED-PUBLISHED
  test_hint: 'Assert group string, state_dim == 20, eq labels, and action_handedness == "right". Make
    the dimension falsifiable: assert 20 == dim(Gal(3)) + dim(gal(3)) == 10 + 10, and that the recorded
    linearised error vector epsilon_k lives in R^20 with A_hat, B_hat both 20x20 in two 10x10 block rows
    (Eqs. 36, 37). Do NOT let state_dim be satisfied by any value that is not also consistent with these
    block shapes.'
  domain: 'Symmetry group, not the manifold: the manifold is M = Gal(3) x R^10.'
  verdict: CONFIRMED
  attack: see docs/verification/m0-literature-matrix.md
