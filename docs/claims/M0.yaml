  statement: 'The exp/log-essential column is exactly {"rai": False, "barfoot": False, "delama": True,
    "gtsam": True}; and CONVENTIONS["delama"]["eq"]["log_G"] == "31" and CONVENTIONS["delama"]["eq"]["error_local_coords"]
    == "34", both recorded as requiring BOTH the Gal(3) logarithm (eq "9") and the inverse left Jacobian
    J_L^-1 (eq "10").'
  source: Delama et al. Eqs. (9), (10), (29), (30), (31), (34); Rai et al. Eqs. (3), (14); Barfoot et
    al. Eqs. (14), (15); GTSAM galileanimufactor Eqs. (6), (42)
  kind: VERIFIED-PUBLISHED
  test_hint: 'Assert the four booleans and the two Delama eq labels, plus that the recorded dependency
    set for eq "34" contains both "log" and "J_L^{-1}". Falsifiability anchor for the False entries: assert
    CONVENTIONS["rai"]["eq"]["chordal_residual"] == "14" and CONVENTIONS["rai"]["eq"]["cayley"] == "3"
