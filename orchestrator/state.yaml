  blocking_findings:
  - id: M1-F01
    resolved: true
    summary: 'CRITICAL: the ''5000-step integrator ground truth'' behind C31/C34/C37/C43 is decorative.
      The endpoint relation is an exact algebraic identity of the discrete recursion for ANY dt (n=1 at
      dt=0.5 gives 1.8e-15), so mutating the fixture to 2 steps at dt=0.25 leaves all four tests passing.
      Meanwhile the 5000-step Euler state is 1.58e-4 from the exact solution -- 10x ABOVE the tests''
      own 1e-5 tolerance. A test that really compared against ODE truth at 1e-5 would FAIL. Validate against
      a stiff ODE solve (DOP853, rtol=atol=1e-13), not the project''s own Euler recursion.'
    resolution: Ruled FIXED by verify-M1-002 (docs/verification/m1-gal3-mechanics_pass2.md).
  - id: M1-F02
    resolved: true
    summary: Constant (omega,a) makes swapped accumulation order invisible -- the flagged defect class.
      E is computed once outside the loop so all step factors commute. integrate_truth's dR @ E -> E @
      dR SURVIVES the entire 55-test suite; euler_increment's dR @ W -> W @ dR survives C41 (diff 3.05e-16).
      With time-varying omega the same swap shows at 1.7e-6. Every order-sensitive test needs a time-varying
      stream.
    resolution: Ruled FIXED by verify-M1-002 (docs/verification/m1-gal3-mechanics_pass2.md).
  - id: M1-F03
    resolved: true
    summary: 'C40 REFUTED in part: ''a factor fitted on one element fails on a second with residual >
      0.5'' is false universally. N_L = Phi(X)X^-1 is exact at X by construction so the residual has no
