      since det(I-[phi]x/2)=1+theta^2/4>=1; five vacuous coverage guards assert ''> 0.0'' on continuous
      draws where P(exactly 0)=0.'
  - id: M1-F05
    resolved: false
    summary: 'Three recorded measurements wrong. C52''s ''measured 2.8e-17'' is off by ~6 orders (really
      1.4e-13 across 4 seeds; 2.8e-17 is below double precision for O(1) quantities and was never plausible).
      C50''s tolerance and domain are mutually inconsistent: domain says |d| <= 1e-4 but at that magnitude
      the error is 5.35e-8, 54x over the 1e-9 bound -- it holds only for |d| <~ 1e-5. C41''s sample count
      IS load-bearing: 10 configs give 2.16e-6 but 1000 give 7.04e-6 against a 1e-5 bound, margin 1.4x.'
  - id: M1-F06
    resolved: false
    summary: 'C24 framing correction (claim CONFIRMED, substitution legitimate): the binding constraint
      BELOW the Taylor switch is truncation, not 1-cos. kappa1''s 3-term truncation is already 7.75e-13
      at theta=5e-2 and would be 1.30e-11 at theta=8e-2, so THETA_SMALL=5e-2 is load-bearing in a way
      the claim does not state. Real headroom ~13x. Record the switch point as a constraint, not an implementation
